
name: release

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish GitHub Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate release and create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // 1. Validate the event and the source/target branches.
            if (!pr || pr.merged !== true) {
              core.setFailed('The pull request was not merged.');
              return;
            }

            if (pr.base.ref !== 'master') {
              core.setFailed('Releases must target master.');
              return;
            }

            if (pr.base.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('Unexpected target repository.');
              return;
            }

            if (!pr.head.repo ||
                pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed(
                'The release branch must belong to this repository.'
              );
              return;
            }

            const branch = pr.head.ref;
            const match = branch.match(
              /^release\/(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
            );

            if (!match) {
              core.setFailed(
                `Invalid release branch "${branch}". ` +
                'Expected release/MAJOR.MINOR.PATCH, e.g. release/1.4.0.'
              );
              return;
            }

            const version = match[1] + '.' + match[2] + '.' + match[3];
            const tag = `v${version}`;
            const mergeSha = pr.merge_commit_sha;

            if (!mergeSha || !/^[0-9a-f]{40}$/i.test(mergeSha)) {
              core.setFailed(
                'Could not determine a valid merge commit SHA.'
              );
              return;
            }

            core.info(`Pull request: #${pr.number}`);
            core.info(`Release branch: ${branch}`);
            core.info(`Release tag: ${tag}`);
            core.info(`Merge commit: ${mergeSha}`);

            await github.rest.repos.getCommit({
              owner,
              repo,
              ref: mergeSha,
            });

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: 'master',
              head: mergeSha,
            });

            if (comparison.status !== 'identical' &&
                comparison.status !== 'ahead' &&
                comparison.status !== 'behind') {
              core.setFailed(
                'Could not validate the merge commit against master.'
              );
              return;
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              core.setFailed(
                `Tag ${tag} already exists. No release was published.`
              );
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });

              core.setFailed(
                `A GitHub Release for ${tag} already exists.`
              );
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: mergeSha,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });

            core.info(`Release published: ${release.data.html_url}`);
