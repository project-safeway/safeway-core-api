services:
  core_db:
    image: mysql
    container_name: safeway_core_db
    ports:
      - "3306:3306"
    expose:
      - "3306"
    environment:
      - MYSQL_USER=safeway
      - MYSQL_PASSWORD=urubu100
      - MYSQL_DATABASE=safeway_core
      - MYSQL_ROOT_PASSWORD=urubu100

  financial_db:
    image: mysql
    container_name: safeway_financial_db
    ports:
      - "3307:3306"
    expose:
      - "3307"
    environment:
      - MYSQL_USER=safeway
      - MYSQL_PASSWORD=urubu100
      - MYSQL_DATABASE=safeway_financial
      - MYSQL_ROOT_PASSWORD=urubu100

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: safeway-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - redis-net
    volumes:
      - redisinsight_data:/data

networks:
  redis-net:
    driver: bridge

volumes:
  redis_data:
  redisinsight_data:
  rabbitmq_data: