# Exemplo de configuracoes locais
jwt.public.key=classpath:keys/pub.key
jwt.private.key=classpath:keys/pri.key

# Chaves dedicadas do Auth V2
auth.v2.jwt.public.key=classpath:keys/pub.key
auth.v2.jwt.private.key=classpath:keys/pri.key

# Credenciais de emissao de token de servico no Auth V2
auth.v2.service-token.client-id=safeway-core
auth.v2.service-token.client-secret=change-me
auth.v2.service-token.expires-in-seconds=3600

# Cliente do monolito para solicitar token de servico ao Auth
auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8080}
auth.service.token-endpoint=${AUTH_SERVICE_TOKEN_ENDPOINT:/auth/v2/token/service}
auth.service.client-id=${AUTH_SERVICE_CLIENT_ID:safeway-core}
auth.service.client-secret=${AUTH_SERVICE_CLIENT_SECRET:change-me}

# H2 em memoria para desenvolvimento
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/safeway_core?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:safeway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:safeway}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.defer-datasource-initialization=true

# Cache Config
spring.cache.type=redis
spring.cache.redis.time-to-live=PT5M
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix="app::"

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

#RabbitMQ Config
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3

rabbitmq.exchanges.aluno=aluno.exchange
rabbitmq.routing-keys.aluno-criado=aluno.criado
rabbitmq.routing-keys.aluno-atualizado=aluno.atualizado
rabbitmq.routing-keys.aluno-inativado=aluno.inativado

# Projeto Google (substitua com valores locais)
google.projectId=SEU_PROJECT_ID
google.maps.api.key=SEU_API_KEY
