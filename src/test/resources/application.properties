spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Disable external services for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.cache.type=none
spring.data.redis.repositories.enabled=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.auto-startup=false

# Mock/Dummy keys if necessary, but try to use existing ones first
jwt.public.key=classpath:keys/pub.key
jwt.private.key=classpath:keys/pri.key
auth.v2.jwt.public.key=classpath:keys/pub.key
auth.v2.jwt.private.key=classpath:keys/pri.key

# Google Maps dummy values
google.projectId=test-project
google.maps.api.key=test-key
